name: CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/oficina-execucao-service
  # Cobertura mínima de linhas, somando testes unitários e de integração (ver scripts/coverage.sh)
  COVERAGE_THRESHOLD: "80"

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Sonar precisa do histórico completo

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java (dotnet-sonarscanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore dependencies
        run: dotnet restore OficinaExecucao.slnx

      - name: Instalar ferramentas (SonarScanner e ReportGenerator)
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.*
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: SonarQube Cloud - begin
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/obj/**" \
            /d:sonar.coverage.exclusions="**/obj/**,tests/**" \
            /d:sonar.qualitygate.wait=true

      - name: Testes (unitários + integração) e cobertura
        run: bash scripts/coverage.sh

      - name: Testes BDD (cenários em Gherkin)
        run: dotnet test tests/OficinaExecucao.Tests.BDD --no-build -c Release

      - name: SonarQube Cloud - end (aguarda o Quality Gate)
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && env.SONAR_ORGANIZATION != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/report
          if-no-files-found: ignore

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in no GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata da imagem
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build e push da imagem
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/bootstrap, infra/terraform/envs/homolog, infra/terraform/envs/prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}

      - name: Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ matrix.dir }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ matrix.dir }}

  deploy-homolog:
    name: Deploy Kubernetes (homolog)
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker, terraform-validate]
    # Opt-in: as credenciais do AWS Academy expiram em ~4h e precisam ser coladas
    # nos secrets do GitHub antes de cada uso. Ative com a variável DEPLOY_HOMOLOG=true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOMOLOG == 'true'
    environment: homolog
    permissions:
      contents: read
    concurrency:
      group: deploy-homolog
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy no cluster (homolog)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Secret AWS_ACCESS_KEY_ID vazio no environment homolog}"
          : "${AWS_SECRET_ACCESS_KEY:?Secret AWS_SECRET_ACCESS_KEY vazio no environment homolog}"
          : "${AWS_SESSION_TOKEN:?Secret AWS_SESSION_TOKEN vazio (credenciais do AWS Academy expiram em ~4h, renove)}"
          : "${GHCR_USERNAME:?Secret GHCR_USERNAME vazio no environment homolog}"
          : "${GHCR_PAT:?Secret GHCR_PAT vazio no environment homolog}"
          : "${NEW_RELIC_LICENSE_KEY:?Secret NEW_RELIC_LICENSE_KEY vazio no environment homolog}"

          # Mesma tag publicada pelo build-docker (metadata-action: type=sha,prefix=sha-, 7 caracteres)
          IMAGE="$(echo "$IMAGE_REPO" | tr '[:upper:]' '[:lower:]'):sha-${COMMIT_SHA:0:7}"
          export IMAGE
          echo "Imagem a implantar: $IMAGE"

          # O pull secret precisa existir antes do rollout, então o kubeconfig é configurado aqui
          # (o deploy.sh repete esse passo, sem efeito colateral).
          CLUSTER_NAME=$(aws ssm get-parameter --name "/oficina/homolog/k8s/cluster-name" --query Parameter.Value --output text)
          aws eks update-kubeconfig --region us-east-1 --name "$CLUSTER_NAME" >/dev/null

          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PAT" \
            -n oficina --dry-run=client -o yaml | kubectl apply -f - >/dev/null
          echo "ghcr-pull-secret atualizado no namespace oficina"

          ./scripts/deploy.sh homolog

      - name: Smoke check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          # O kubeconfig gerado no passo anterior permanece no runner.
          READY=$(kubectl get deployment oficina-execucao-service -n oficina -o jsonpath='{.status.readyReplicas}')
          DEPLOYED_IMAGE=$(kubectl get deployment oficina-execucao-service -n oficina -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Imagem implantada: $DEPLOYED_IMAGE"
          echo "Réplicas prontas: ${READY:-0}"
          if [ "${READY:-0}" -lt 1 ]; then
            echo "Smoke check falhou: nenhuma réplica pronta" >&2
            exit 1
          fi
